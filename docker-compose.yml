# API and PostgreSQL on a shared network.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: IRacingLeague
      POSTGRES_USER: iracing
      POSTGRES_PASSWORD: "IRacing!Pass2026"
    ports:
      - "9008:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - iracing

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      ConnectionStrings__ServerDB: "Host=db;Port=5432;Database=IRacingLeague;Username=iracing;Password=IRacing!Pass2026"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8009:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iracing

volumes:
  postgres-data:

networks:
  iracing:
